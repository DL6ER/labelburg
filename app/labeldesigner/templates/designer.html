<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15171a">
    <title>Labels</title>
    <!-- Installed as an app (home screen, desktop) -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/app/apple-touch-icon.png') }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Labels">
    <script>
        // Set the theme before the page is drawn, so that it does not flash
        (function () {
            let mode = null;
            try { mode = localStorage.getItem('designer_theme'); } catch (e) { }
            if (mode === 'dark' || mode === 'light') document.documentElement.setAttribute('data-theme', mode);
        })();
    </script>
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='images/favicon/android-icon-192x192.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='images/favicon/favicon-16x16.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='designer/main.css') }}?v={{ version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='designer/settings.css') }}?v={{ version }}">
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>
        <symbol id="i-qr" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 20h1v1h-1zM20 14h1"/></symbol>
        <symbol id="i-barcode" viewBox="0 0 24 24"><path d="M4 5v14M7 5v14M10 5v14M14 5v14M16 5v14M20 5v14"/></symbol>
        <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></symbol>
        <symbol id="i-crop" viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"/></symbol>
        <symbol id="i-angle" viewBox="0 0 24 24"><path d="M4 20h16M4 20 15 6M11 20a7 7 0 0 0-2.2-5.1"/></symbol>
        <symbol id="i-gap" viewBox="0 0 24 24"><path d="M4 5v14M20 5v14M8 12h8M10 9l-2 3 2 3M14 9l2 3-2 3"/></symbol>
        <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
        <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.4 8 8 9 4.6-1 8-4 8-9V6z"/></symbol>
        <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></symbol>
        <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6"/></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
        <symbol id="i-copies" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></symbol>
        <symbol id="i-prev" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
        <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
        <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
        <symbol id="i-printer" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
        <symbol id="i-bold" viewBox="0 0 24 24"><path d="M7 4h7a4 4 0 0 1 0 8H7zM7 12h8a4 4 0 0 1 0 8H7z"/></symbol>
        <symbol id="i-italic" viewBox="0 0 24 24"><path d="M19 4h-9M14 20H5M15 4 9 20"/></symbol>
        <symbol id="i-underline" viewBox="0 0 24 24"><path d="M6 4v6a6 6 0 0 0 12 0V4M4 21h16"/></symbol>
        <symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></symbol>
        <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></symbol>
        <symbol id="i-center" viewBox="0 0 24 24"><path d="M18 10H6M21 6H3M21 14H3M18 18H6"/></symbol>
        <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 10H3M21 6H3M21 14H3M15 18H3"/></symbol>
        <symbol id="i-right" viewBox="0 0 24 24"><path d="M21 10H9M21 6H3M21 14H3M21 18H9"/></symbol>
        <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
        <symbol id="i-none" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" stroke-dasharray="2 3"/></symbol>
        <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
        <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
        <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
        <symbol id="i-hash" viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></symbol>
        <symbol id="i-blank" viewBox="0 0 24 24"><path d="M8 4H5v16h3M16 4h3v16h-3"/></symbol>
        <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></symbol>
        <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-1"/></symbol>
        <symbol id="i-vpos" viewBox="0 0 24 24"><path d="M4 4h16M4 20h16M9 12h6"/></symbol>
        <symbol id="i-vtop" viewBox="0 0 24 24"><path d="M4 4h16M4 20h16M9 9h6"/></symbol>
        <symbol id="i-vbottom" viewBox="0 0 24 24"><path d="M4 4h16M4 20h16M9 15h6"/></symbol>
        <symbol id="i-mirror" viewBox="0 0 24 24"><path d="M12 3v18M8 7 4 12l4 5zM16 7l4 5-4 5z"/></symbol>
        <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 2v10M8 8l4 4 4-4"/><rect x="3" y="15" width="18" height="6" rx="2"/><path d="M7 18h.01M11 18h.01"/></symbol>
        <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
        <symbol id="i-contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></symbol>
        <symbol id="i-todo" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 3 3 5-6"/></symbol>
        <symbol id="i-spacing" viewBox="0 0 24 24"><path d="M10 6h11M10 12h11M10 18h11M4 8l2-3 2 3M4 16l2 3 2-3M6 5v14"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
        <symbol id="i-braces" viewBox="0 0 24 24"><path d="M8 3H7a2 2 0 0 0-2 2v4a2 2 0 0 1-2 2 2 2 0 0 1 2 2v4a2 2 0 0 0 2 2h1M16 3h1a2 2 0 0 1 2 2v4a2 2 0 0 0 2 2 2 2 0 0 0-2 2v4a2 2 0 0 1-2 2h-1"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
        <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 2 20h20zM12 10v4M12 17h0"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
        <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
        <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h16M16 4l4 4-4 4M20 16H4M8 12l-4 4 4 4"/></symbol>
        <symbol id="i-grip" viewBox="0 0 24 24"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></symbol>
        <symbol id="i-cable" viewBox="0 0 24 24"><path d="M4 12h6M14 12h6M10 8v8h4V8z"/></symbol>
        <symbol id="i-break" viewBox="0 0 24 24"><path d="M20 5v6a3 3 0 0 1-3 3H5M9 10l-4 4 4 4"/></symbol>
        <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
        <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 3h7v7M21 3l-9 9M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></symbol>
        <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
    </svg>

    <header class="top">
        <a class="brand" href="#edit"><span class="mark"><svg viewBox="111 112 290 290" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M111 186 V112 H169 V164 H227 V112 H285 V164 H343 V112 H401 V326 L325 402 H135 A24 24 0 0 1 111 378 Z M216 402 V322 A40 40 0 0 1 296 322 V402 Z"/></svg></span><span>Labels</span></a>
        <nav class="tabs" id="tabs">
            <a href="#edit" data-tab="edit">Editor</a>
            <a href="#settings" data-tab="settings">Settings</a>
        </nav>
        <span class="sp"></span>
        <button class="search" id="openSearch" type="button" aria-label="Search labels"><svg class="ic s"><use href="#i-search"/></svg><span class="grow">Search labels</span><span class="kbd">Ctrl K</span></button>
        <button class="pchip" id="printerChip" type="button" aria-haspopup="dialog"><span class="d off"></span><b>Printer</b></button>
        <a class="iconbtn gear" id="gear" href="#settings" title="Settings" aria-label="Settings"><svg class="ic"><use href="#i-gear"/></svg></a>
        <!-- On the phone this is the bar at the bottom -->
        <div class="mainacts" id="mainActs">
            <button class="iconbtn foot-adv" id="footAdv" type="button" title="Advanced" aria-label="Advanced" aria-expanded="false"><svg class="ic"><use href="#i-sliders"/></svg></button>
            <button class="btn ghost" id="save" type="button" title="Save to your labels"><svg class="ic s"><use href="#i-save"/></svg><span class="lbl">Save</span></button>
            <div class="printbtn">
                <span class="cnt"><button type="button" data-step="-1" aria-label="One copy less">&minus;</button><input id="copies" type="number" min="1" max="100" value="1" aria-label="Copies"><button type="button" data-step="1" aria-label="One copy more">+</button></span>
                <button class="go" id="print" type="button"><svg class="ic s"><use href="#i-printer"/></svg>Print</button>
            </div>
        </div>
    </header>

    <main id="view"></main>

    <div class="scrim" id="scrim" hidden></div>
    <div class="layer" id="layer" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="queue" id="queue" hidden></div>

    <script>window.DESIGNER_CONFIG = {{ config|tojson }};</script>
    <script>window.DESIGNER_BUILD = {{ build|tojson }};</script>
    <script type="module" src="{{ url_for('static', filename='designer/main.js') }}?v={{ version }}"></script>
</body>
</html>
