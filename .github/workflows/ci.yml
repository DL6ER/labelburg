name: Python tests

# A branch of this repository is tested when it is pushed, a pull request
# only when it comes from a fork: each commit once
on:
  push:
  pull_request:

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: run tests
        uses: devcontainers/ci@v0.3
        with:
          runCmd: pytest -n auto

  # The label designer in a browser, see tests/browser. Not in the devcontainer:
  # Playwright's Chromium does not run on Alpine.
  browser:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install fonts and PDF tools
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core poppler-utils
      - name: Install Python packages
        run: pip install -r requirements-browser.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: pytest -n auto tests/browser

  # Typos and British spellings in code, comments and docs, see .codespellrc,
  # and the spelling of the German demo labels
  spelling:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install codespell
        run: pip install -r requirements-spelling.txt
      - name: Check spelling
        run: codespell
      - name: Install hunspell and the German dictionary
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends hunspell hunspell-de-de
      - name: Check the spelling of the German demo labels
        run: python tools/spelling_de.py
